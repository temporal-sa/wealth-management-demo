spring:
  main:
    allow-bean-definition-overriding: true
    web-application-type: none
  application:
    name: open-account
  # Temporal connection: TEMPORAL_ADDRESS and TEMPORAL_NAMESPACE, as for the frameworks, defaulting to a local
  # dev server. The cloud profiles (application-tc.yaml, application-tc-apikey.yaml) are chosen by startcloudworker.sh.
  temporal:
    namespace: ${TEMPORAL_NAMESPACE:default}
    connection:
      target: ${TEMPORAL_ADDRESS:127.0.0.1:7233}
  # Redis configuration (claim check storage). REDIS_URL is passed as SPRING_DATA_REDIS_URL by the
  # start scripts, and wins over these when set.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
