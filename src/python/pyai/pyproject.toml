[project]
name = "pyai-wealth-management"
version = "0.1.0"
description = "Wealth management demo: the Pydantic AI port"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=1.37.0",
    # Used directly by the shared src/python/common modules and the codec server
    "temporalio>=1.20.0",
    "redis>=7.1.0",
    "aiohttp>=3.12.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The port's own packages, plus src/python for the shared common/ package.
dev-mode-dirs = [".", ".."]

[tool.hatch.build.targets.wheel]
packages = ["standalone", "durable", "prompts", "pyai_agents"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
pythonpath = [".", ".."]
