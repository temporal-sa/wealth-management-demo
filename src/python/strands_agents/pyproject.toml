[project]
name = "strands-wealth-management"
version = "0.1.0"
description = "Wealth management demo: the Strands Agents port (with an optional Temporal durable-execution version)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents[gemini]>=1.0.0",
    "strands-agents-tools>=0.1.0",
    "temporalio[strands-agents]>=1.28.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9",
]

[project.scripts]
strands-supervisor = "standalone.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The port's own packages, plus src/python for the shared common/ package.
dev-mode-dirs = [".", ".."]

[tool.hatch.build.targets.wheel]
packages = ["standalone", "durable", "prompts"]
