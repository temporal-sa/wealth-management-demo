[project]
name = "langgraph-wealth-management"
version = "0.1.0"
description = "Wealth management demo: the LangGraph framework, with a Temporal durable-execution version (temporalio-langgraph)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.11,<4",
    "langchain-google-genai>=4.5.2",
    "langgraph>=1.2.24",
    "pydantic>=2.11.7,<3",
    "redis>=6.2.0,<9",
    "temporalio-langgraph>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".", ".."]

[tool.hatch.build.targets.wheel]
packages = ["standalone", "durable", "prompts", "lg_agents"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
pythonpath = [".", ".."]
