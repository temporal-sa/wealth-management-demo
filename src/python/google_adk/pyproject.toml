[project]
name = "adk-wealth-management"
version = "0.1.0"
description = "Wealth management demo: the Google ADK framework for Python (with a Temporal durable-execution version)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk>=2.8.0",
    "pydantic>=2.11.7",
    "redis>=6.2.0",
    "aiohttp>=3.12.0",
    "temporalio[google-adk]>=1.35.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
adk-supervisor = "standalone.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build]
# The framework's own packages, plus src/python for the shared common/ package.
dev-mode-dirs = [".", ".."]

[tool.hatch.build.targets.wheel]
packages = ["standalone", "durable", "prompts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
pythonpath = [".", ".."]
